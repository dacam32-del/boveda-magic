<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12101c">
<title>Bóveda Magic — Tienda de cartas Magic</title>
<meta name="description" content="Catálogo y tienda de cartas Magic: The Gathering de David Eduardo. Precios en pesos chilenos.">
<meta property="og:title" content="Bóveda Magic">
<meta property="og:description" content="Cartas Magic: The Gathering a la venta, precios en CLP.">
<style>
:root{--bg:#12101c;--panel:#1d1a2b;--panel2:#15131f;--line:rgba(255,255,255,.09);--txt:#ece8f5;--mut:#a9a3bd;--gold:#f6d77a;--gold2:#e9a94b;--green:#7ee2a8;
--W:#efe6c8;--U:#4a90d9;--B:#8e7aa8;--R:#e0533d;--G:#3fa564;--M:#d4af37;--C:#9aa0a6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;
background:radial-gradient(900px 500px at 50% -180px,#2a1f4a 0%,#12101c 60%,#0b0a12 100%) no-repeat,var(--bg)}
button,input,select{font:inherit;color:inherit}
header{text-align:center;padding:22px 16px 8px}
.logo{font-size:34px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold),var(--gold2),#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 16px;min-width:130px}
.stat b{display:block;font-size:22px;color:var(--gold)}.stat span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.bar{position:sticky;top:0;z-index:5;background:rgba(18,16,28,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.row{display:flex;gap:8px;max-width:1180px;margin:0 auto}
.search{flex:1;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 36px;font-size:15px;outline:none}
.search input:focus{border-color:var(--gold2)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
select{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;max-width:44%}
.filters{max-width:1180px;margin:8px auto 0}
.fgroup{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px!important;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0}
.fgroup::-webkit-scrollbar{display:none}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);min-width:62px;flex-shrink:0}
.chip{flex-shrink:0;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.chip .n{font-size:11px;color:var(--mut)}
.chip.on{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1408;border-color:transparent;font-weight:600}
.chip.on .n{color:#3d2f10}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.meta-row{max-width:1180px;margin:6px auto 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.clear{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;text-decoration:underline;visibility:hidden}
.clear.show{visibility:visible}
main{max-width:1180px;margin:0 auto;padding:14px 12px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.tile{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;text-align:left;padding:0}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.tile .ph{position:relative;padding:8px 8px 0}
.tile img{width:100%;aspect-ratio:488/680;object-fit:cover;border-radius:9px;display:block;background:#0e0c16}
.badges{position:absolute;top:13px;left:13px;display:flex;gap:4px}
.rb{position:absolute;top:13px;right:13px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid var(--rc);color:var(--rc)}
.foilb{position:absolute;bottom:6px;right:13px;background:linear-gradient(90deg,#7ef,#c7f,#fd7);color:#111;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px}
.tile .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.tile h3{font-size:14.5px;line-height:1.2;font-weight:700}
.tile .s{font-size:11.5px;color:var(--mut)}
.tile .pr{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:flex-end}
.price{font-size:19px;font-weight:800;color:var(--green)}
.stock{font-size:11px;color:var(--gold);font-weight:600}.stock.out{color:var(--R)}
.empty{text-align:center;color:var(--mut);padding:50px 10px;font-size:15px;display:none}
footer{text-align:center;color:#7c7790;font-size:12px;padding:20px 16px 30px;line-height:1.6}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:radial-gradient(700px 400px at 50% 0,#241b3e 0%,#0b0a12 70%) #0b0a12;display:none;flex-direction:column}
#modal.open{display:flex}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
#pos{font-size:14px;color:var(--mut);font-weight:600;letter-spacing:1px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.det{max-width:980px;margin:0 auto;padding:4px 16px 100px;display:grid;grid-template-columns:1fr;gap:16px}
.det.anim{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.bigimg{display:flex;justify-content:center}
.bigimg img{width:min(80%,340px);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);background:#0e0c16;aspect-ratio:488/680}
.dh h2{font-size:24px;line-height:1.15}
.dh .en{color:var(--mut);font-style:italic;font-size:15px;margin-top:2px}
.mana{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#222;background:#bdb7ae;box-shadow:0 1px 2px rgba(0,0,0,.6);vertical-align:middle}
.pricebox{margin-top:12px;background:linear-gradient(135deg,rgba(126,226,168,.12),rgba(246,215,122,.08));border:1px solid rgba(126,226,168,.25);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pricebox .big{font-size:30px;font-weight:800;color:var(--green);line-height:1}
.pricebox .big small{font-size:13px;color:#8fcfa9}
.pricebox .mk{text-align:right;font-size:12.5px;color:var(--mut);line-height:1.5}
.oracle{margin-top:12px;background:#f1ead8;color:#1d1a14;border-radius:12px;padding:12px 14px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.45}
dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
dt{color:var(--mut)}dd{color:var(--txt)}
.nota{margin-top:10px;font-size:12.5px;color:var(--mut);background:rgba(255,255,255,.04);border-left:3px solid var(--gold2);padding:8px 10px;border-radius:6px}
.sf{display:inline-block;margin-top:14px;color:var(--gold);font-size:14px;text-decoration:none;border:1px solid rgba(246,215,122,.4);padding:8px 14px;border-radius:999px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(6,5,12,.98) 40%,rgba(6,5,12,0));pointer-events:none}
.nav button{pointer-events:auto;min-width:120px;height:46px;border-radius:999px;border:1px solid rgba(246,215,122,.45);background:rgba(29,26,43,.95);color:var(--gold);font-weight:700;font-size:15px;cursor:pointer}
.nav button:disabled{opacity:.3}
.hint{color:var(--mut);font-size:12px;pointer-events:none}
@media(min-width:760px){
  .logo{font-size:44px}.stat{min-width:180px}.stat b{font-size:26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .tile h3{font-size:16px}.price{font-size:22px}
  .det{grid-template-columns:minmax(300px,400px) 1fr;align-items:start;padding-top:20px}
  .bigimg img{width:100%}
}
</style>
</head>

const state = {q:"", sort:"recientes", sel:{color:new Set(),tipo:new Set(),rareza:new Set(),edicion:new Set()}};
let list = [], cur = 0;

function buildFilters(){
  const box = document.getElementById("filters"); box.innerHTML = "";
  for (const g of groups){
    const counts = {}; cards.forEach(c => g.get(c).forEach(v => counts[v]=(counts[v]||0)+(c.cantidad??1)));
    let vals = Object.keys(counts);
    vals.sort((a,b)=>{ if(g.order){ const ia=g.order.findIndex(o=>a.startsWith(o)), ib=g.order.findIndex(o=>b.startsWith(o)); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b,"es"); } return a.localeCompare(b,"es"); });
    if (!vals.length) continue;
    const row = document.createElement("div"); row.className="fgroup";
    row.innerHTML = `<span class="flabel">${g.label}</span>` + vals.map(v => {
      const dot = g.key==="color" ? `<span class="dot" style="background:${COLOR_DOT[v]}"></span>` : g.key==="rareza" ? `<span class="dot" style="background:${RAR_COL[v]||"#777"}"></span>` : "";
      const label = g.key==="edicion" ? v.replace(/\s*\(([^)]+)\)$/, " · $1") : v;
      return `<button class="chip" data-group="${g.key}" data-value="${esc(v)}">${dot}${esc(label)} <span class="n">${counts[v]}</span></button>`; }).join("");
    box.appendChild(row);
  }
  box.addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return;
    const s = state.sel[b.dataset.group], v = b.dataset.value; s.has(v)?s.delete(v):s.add(v); b.classList.toggle("on", s.has(v)); render(); });
}
function filtered(){
  const q = state.q.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  let out = cards.filter(c => (!q || q.split(/\s+/).every(w => c._search.includes(w))) &&
    groups.every(g => { const s=state.sel[g.key]; return !s.size || g.get(c).some(v => s.has(v)); }));
  const S = {precio_asc:(a,b)=>(a.sugerido_clp??0)-(b.sugerido_clp??0)||a.nombre_es.localeCompare(b.nombre_es,"es"),
             precio_desc:(a,b)=>(b.sugerido_clp??0)-(a.sugerido_clp??0)||a.nombre_es.localeCompare(b.nombre_es,"es"),
             nombre:(a,b)=>a.nombre_es.localeCompare(b.nombre_es,"es"),
             recientes:(a,b)=>(b.fecha_alta||"").localeCompare(a.fecha_alta||"")||b.id-a.id};
  return out.sort(S[state.sort]);
}
function tile(c, idx){
  const pips = ((c.colores&&c.colores.length)?c.colores:((c.tipos||[]).includes("Tierra")?(c.identidad_color||[]):[])).map(k=>`<span class="dot" style="background:${COLORS[k][1]}"></span>`).join("") || `<span class="dot" style="background:var(--C)"></span>`;
  const stock = c.cantidad ?? 1;
  return `<button class="tile" data-idx="${idx}" style="--acc:${accent(c)}">
    <div class="ph"><img src="${esc(c.img)}" alt="${esc(c.nombre_es)}" loading="lazy" decoding="async">
      <div class="badges">${pips}</div><span class="rb" style="--rc:${RAR_COL[c._rar]||"#bbb"}">${esc(c._rar==="Ficha (sin rareza)"?"Ficha":c._rar)}</span>${c.foil?'<span class="foilb">FOIL</span>':""}</div>
    <div class="in"><h3>${esc(c.nombre_es)}</h3><div class="s">${esc((c.set.match(/\(([^)]+)\)$/)||[])[1]||c.set)} · #${esc(c.numero)} · ${esc(c.tipo_categoria||"")}</div>
      <div class="pr"><span class="price">${clp(c.sugerido_clp)}</span><span class="stock ${stock<1?"out":""}">${stock<1?"Agotada":"Stock "+stock}</span></div></div></button>`;
}
function render(){
  list = filtered();
  document.getElementById("grid").innerHTML = list.map(tile).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  const any = state.q || Object.values(state.sel).some(s=>s.size);
  const n = list.reduce((a,c)=>a+(c.cantidad??1),0);
  document.getElementById("count").textContent = `${list.length} ${list.length===1?"resultado":"resultados"}${any?` de ${cards.length}`:""} · ${n} ${n===1?"carta":"cartas"}`;
  document.getElementById("clear").classList.toggle("show", !!any);
}
function detail(dx){
  const c = list[cur]; if(!c) return;
  const stock = c.cantidad ?? 1;
  const det = document.getElementById("det");
  det.classList.remove("anim"); void det.offsetWidth; det.style.setProperty("--dx", (dx||0)+"px"); det.classList.add("anim");
  det.innerHTML = `<div class="bigimg"><img src="${esc(c.img)}" alt="${esc(c.nombre_es)}"></div>
  <div><div class="dh"><h2>${esc(c.nombre_es)} <span class="mana">${mana(c.coste)}</span></h2><div class="en">${esc(c.nombre_en)}</div></div>
    <div class="pricebox"><div><div class="big">${clp(c.sugerido_clp)} <small>CLP</small></div><div class="stock ${stock<1?"out":""}" style="margin-top:6px;font-size:13px">${stock<1?"Agotada":"Stock disponible: "+stock}</div></div>
      <div class="mk">Precio mercado<br><b style="color:var(--txt)">${usd(c.mercado_usd)}</b> · ${clp(c.mercado_clp)} CLP</div></div>
    ${c.texto?`<div class="oracle">${richText(c.texto)}</div>`:""}
    <dl>
      <dt>Edición</dt><dd>${esc(c.set)} · #${esc(c.numero)}</dd>
      <dt>Tipo</dt><dd>${esc(c.tipo)}</dd>
      <dt>Coste</dt><dd>${c.coste?mana(c.coste):"—"}</dd>
      <dt>Color</dt><dd><span class="dot" style="background:${COLOR_DOT[c._color]}"></span> ${esc(c._color)}</dd>
      <dt>Rareza</dt><dd>${esc(c.rareza)}</dd>
      <dt>Ilustrador</dt><dd>${esc(c.ilustrador||"—")}</dd>
      <dt>Idioma</dt><dd>${esc(c.idioma||"—")}</dd>
      <dt>Estado</dt><dd>${esc(c.estado||"—")}</dd>
      <dt>Foil</dt><dd>${c.foil?"Sí ✨":"No"}</dd>
      <dt>Ingreso</dt><dd>${esc(c.fecha_alta||"—")}</dd>
    </dl>
    ${c.nota?`<div class="nota">ⓘ ${esc(c.nota)}</div>`:""}
    ${c.scryfall_url?`<a class="sf" href="${esc(c.scryfall_url)}" target="_blank" rel="noopener">Ver en Scryfall ↗</a>`:""}
  </div>`;
  document.getElementById("pos").textContent = `${cur+1} / ${list.length}`;
  document.getElementById("prev").disabled = cur===0;
  document.getElementById("next").disabled = cur===list.length-1;
  document.querySelector("#modal .stage").scrollTop = 0;
  history.replaceState(null, "", "#carta-" + c.id);
}
function openAt(i){ cur=i; document.getElementById("modal").classList.add("open"); document.body.style.overflow="hidden"; detail(0); }
function closeM(){ document.getElementById("modal").classList.remove("open"); document.body.style.overflow=""; history.replaceState(null,"",location.pathname+location.search); }
function go(d){ const n=cur+d; if(n<0||n>=list.length) return; cur=n; detail(d>0?40:-40); }

document.getElementById("grid").addEventListener("click", e => { const t=e.target.closest(".tile"); if(t) openAt(+t.dataset.idx); });
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("close").onclick = closeM;
document.addEventListener("keydown", e => { if(!document.getElementById("modal").classList.contains("open")) return;
  if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1); else if(e.key==="Escape") closeM(); });
(() => { const st=document.querySelector("#modal .stage"); let x0=null,y0=null;
  st.addEventListener("touchstart", e => { x0=e.changedTouches[0].clientX; y0=e.changedTouches[0].clientY; }, {passive:true});
  st.addEventListener("touchend", e => { if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3) go(dx<0?1:-1); x0=null; }, {passive:true}); })();
document.getElementById("q").addEventListener("input", e => { state.q=e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort=e.target.value; render(); });
document.getElementById("clear").onclick = () => { state.q=""; document.getElementById("q").value=""; Object.values(state.sel).forEach(s=>s.clear());
  document.querySelectorAll(".chip.on").forEach(b=>b.classList.remove("on")); render(); };

const totalQty = cards.reduce((a,c)=>a+(c.cantidad??1),0);
document.getElementById("stTotal").textContent = totalQty;
document.getElementById("stValor").textContent = clp(cards.reduce((a,c)=>a+(c.sugerido_clp||0)*(c.cantidad??1),0));
document.getElementById("sub").textContent = `Cartas Magic: The Gathering${DATA.dueno?" · "+DATA.dueno:""}`;
document.getElementById("foot").innerHTML = `Precios de mercado: ${esc(DATA.fuente)} · Dólar $${esc(DATA.dolar_clp)} CLP<br>Actualizado ${esc(DATA.actualizado)} · Precios de venta en pesos chilenos`;
buildFilters(); render();
const m = location.hash.match(/^#carta-(\d+)$/); if(m){ const i=list.findIndex(c=>String(c.id)===m[1]); if(i>=0) openAt(i); }
</script>
</body>
</html>
